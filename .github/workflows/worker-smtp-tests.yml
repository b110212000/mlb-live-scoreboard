name: SMTP and feedback safety tests

on:
  pull_request:
    paths:
      - worker/src/smtp.js
      - worker/src/account-mail.js
      - worker/src/index.js
      - worker/src/feedback.js
      - tests/smtp.cjs
      - tests/account-mail.cjs
      - tests/account-mail-service.cjs
      - tests/feedback.cjs
      - .github/workflows/worker-smtp-tests.yml
  push:
    branches: [main]
    paths:
      - worker/src/smtp.js
      - worker/src/account-mail.js
      - worker/src/index.js
      - worker/src/feedback.js
      - tests/smtp.cjs
      - tests/account-mail.cjs
      - tests/account-mail-service.cjs
      - tests/feedback.cjs
      - .github/workflows/worker-smtp-tests.yml

permissions:
  contents: read

jobs:
  smtp-and-feedback:
    name: SMTP recipient / public feedback safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mocked Gmail SMTP
        run: node tests/smtp.cjs
      - name: Verify RPC validation
        run: node tests/account-mail.cjs
      - name: Verify private delivery rate limits
        run: node tests/account-mail-service.cjs
      - name: Verify feedback cannot redirect mail
        run: node tests/feedback.cjs
